name: Build TGV14 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Check project archive
        run: |
          test -f TGV14_Offline_Android.zip || {
            echo "Не найден TGV14_Offline_Android.zip в корне репозитория."
            exit 1
          }

      - name: Extract Android project
        run: |
          mkdir -p source
          unzip -q TGV14_Offline_Android.zip -d source
          test -f source/TGV14_Offline_Android/app/build.gradle

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: source/TGV14_Offline_Android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TGV14-Offline-APK
          path: source/TGV14_Offline_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
